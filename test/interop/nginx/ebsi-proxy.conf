# test/interop/nginx/ebsi-proxy.conf
#
# `EBSI_SANDBOX_BASE_URL` には EBSI Pilot のオリジン（`https://api-pilot.ebsi.eu`）を設定する。
# パスや末尾の `/` は省く。
# 疎通確認は `pairs.json` の `healthPath` で指定した公開 DID Registry に転送する。

server {
    listen 8095;

    location / {
        # 実際のサンドボックス URL は環境変数で外部から注入する運用を想定（ビルド時ではなく
        # 実行時に差し替えられるよう、envsubst 経由で resolver + proxy_pass を組み立てる）。
        resolver 127.0.0.11 valid=30s;
        set $ebsi_upstream "${EBSI_SANDBOX_BASE_URL}";
        proxy_pass $ebsi_upstream;
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
    }
}
