# test/interop/nginx/waltid-tls-proxy.conf
#
# walt.id issuer-api / verifier-api の OID4VCI/OID4VP プロトコル層を自動化するには、本 SDK の
# 公開 API の Holder クライアントを実際に呼び出す必要があるが、同クライアントは
# `response_uri`（OID4VP）・`credential_offer_uri`（OID4VCI）に HTTPS を要求し、`http://` は
# ローカル開発用の例外なく拒否する（`request.ts` の `assertResponseUriIsSafe` コメント参照。
# VP Token / client_assertion の平文送出を防ぐ意図的な設計）。walt.id の Docker イメージは平文
# HTTP でしか話さないため、この nginx が自己署名証明書（`test/interop/waltid/tls/`、非秘匿の
# テスト専用鍵）で TLS 終端し、平文で各サービスへ転送する。
#
# 公開ホスト検査: walt.id の `baseUrl` は SDK の公開ホスト検査（`isPublicHttpsUrl`）を
# 通る FQDN（`*.waltid.interop.example`）にする。名前解決は `docker-compose.yml` の
# `waltid-tls-proxy` の network alias（compose ネットワークの DNS）で行い、駆動側（`waltid-driver`
# サービス）も同じネットワーク内から名前を引く。`server_name` / 証明書の SAN
# （`test/interop/waltid/tls/README.md`）もこの FQDN に揃える。
#
# upstream は変数 + `resolver` 経由で毎リクエスト解決する（`test/interop/nginx/ebsi-proxy.conf`
# と同じ理由）。nginx はデフォルトで upstream ホスト名を起動時に一度だけ解決してキャッシュする
# ため、`docker compose restart waltid-issuer` 等でコンテナの内部 IP が変わると
# `connect() failed (111: Connection refused)` で恒久的に壊れる。

server {
    listen 8097 ssl;
    server_name issuer.waltid.interop.example;

    ssl_certificate     /etc/nginx/tls/server-cert.pem;
    ssl_certificate_key /etc/nginx/tls/server-key.pem;

    resolver 127.0.0.11 valid=10s;

    location / {
        set $issuer_upstream "http://waltid-issuer:7002";
        proxy_pass $issuer_upstream;
        proxy_set_header Host $host;
    }
}

server {
    listen 8098 ssl;
    server_name verifier.waltid.interop.example;

    ssl_certificate     /etc/nginx/tls/server-cert.pem;
    ssl_certificate_key /etc/nginx/tls/server-key.pem;

    resolver 127.0.0.11 valid=10s;

    location / {
        set $verifier_upstream "http://waltid-verifier:7003";
        proxy_pass $verifier_upstream;
        proxy_set_header Host $host;
    }
}
