# test/interop/waltid/verifier-config/verifier-service.conf
#
# baseUrl はレスポンスに埋め込まれる response_uri 等の自己参照 URL に使われる。
# 本 SDK の OID4VP Holder クライアントは response_uri に HTTPS を要求するため、`waltid-tls-proxy`
# （test/interop/nginx/waltid-tls-proxy.conf）が自己署名証明書で TLS 終端した外部アドレスを指す。
# 解説は issuer-config/issuer-service.conf 参照。
baseUrl = "https://verifier.waltid.interop.example:8098"
x509SanDnsClientId = "verifier.potential.walt-test.cloud"
