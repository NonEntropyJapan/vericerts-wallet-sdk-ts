# test/interop/waltid/issuer-config/issuer-service.conf
#
# baseUrl はレスポンスに埋め込まれる credential_offer_uri・credential_issuer 等の自己参照 URL に
# 使われる。本 SDK の OID4VCI Holder クライアントは offer_uri に HTTPS を要求する
# ため、`waltid-tls-proxy`（test/interop/nginx/waltid-tls-proxy.conf）が自己署名証明書で TLS
# 終端した外部アドレスを指す。他の設定ファイル（web.conf 等）はイメージ既定のまま変更していない
# （`docker cp` でイメージから抽出したもの）。
#
# ホストは SDK の公開ホスト検査（`isPublicHttpsUrl`。ループバック・`localhost`・単一ラベル等を拒否）を
# 通る FQDN にする。`localhost` のままだと Offer 取得後・Receive 前に 3004 で拒否され、
# 2 ペアが常時 skipped になる。名前は compose ネットワークの DNS（`waltid-tls-proxy` の
# network alias）で解決する。
baseUrl = "https://issuer.waltid.interop.example:8097"
